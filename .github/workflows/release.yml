name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.17.1
      - run: zig build -Doptimize=ReleaseFast
      - run: zig build test
      - name: Package
        run: |
          cd zig-out/bin
          tar czf claudia-${{ github.ref_name }}-linux-arm64.tar.gz claudia
      - uses: softprops/action-gh-release@v2
        with:
          files: zig-out/bin/claudia-*.tar.gz
